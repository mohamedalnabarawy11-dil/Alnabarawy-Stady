name: Build Nabraawy Study APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment, settings and keystore
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          rm -f app/src/main/java/com/example/core/AppCheckInit.kt
          rm -f app/google-services.json
          rm -f app/src/main/res/values/firebase_applet_config.xml
          sed -i '/foojay-resolver-convention/d' settings.gradle.kts
          CLEAN_KEY=$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]')
          if [ -n "$CLEAN_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$CLEAN_KEY" > .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NabraawyStudy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
